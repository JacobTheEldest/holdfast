---
name: Validate

on:
  pull_request:
    branches:
      - master

jobs:
  validate:
    name: Validation gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Detect changes
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: filter
        with:
          filters: |
            brew:
              - 'custom/brew/**'
            flatpaks:
              - 'custom/flatpak/**'
            justfiles:
              - 'custom/ujust/**'
              - 'Justfile'
            shell:
              - 'build/**/*.sh'
            renovate:
              - '.github/renovate.json5'
              - '.github/workflows/renovate.yml'

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Every step below uses `!cancelled() && <filter>` so one validator
      # failing doesn't skip the others. Each validate step is also marked
      # `continue-on-error: true` and given an `id`; the final gate step
      # aggregates outcomes and fails the job if any validator failed.

      # --- Brewfiles ---
      - name: Set up Homebrew
        if: ${{ !cancelled() && steps.filter.outputs.brew == 'true' }}
        uses: Homebrew/actions/setup-homebrew@6eaeff80e7e5c43087c0e5eb5aa82120399e9c91 # master

      - name: Validate Brewfiles
        id: brew-validate
        continue-on-error: true
        if: ${{ !cancelled() && steps.filter.outputs.brew == 'true' }}
        shell: bash
        run: |
          echo "Validating Brewfiles in custom/brew/ directory..."

          find "custom/brew" -iname '*\.Brewfile*' -print0 | \
            while IFS= read -r -d '' brewfile ; do \
              echo "::group:: ===$(basename $brewfile)==="
              grep -E -e "^tap" $brewfile > taps.Brewfile || echo "# No taps" > taps.Brewfile
              set -xeuo pipefail
              brew bundle --file=./taps.Brewfile
              # Trust any third-party taps just installed. Homebrew added an
              # untrusted-tap guardrail; without this, `brew bundle exec` below
              # refuses to load formulae from non-core taps.
              awk -F'"' '/^tap/ {print $2}' "$brewfile" | while read -r tap ; do
                [[ -n "$tap" ]] && brew trust "$tap"
              done
              if brew bundle exec whoami --file="$brewfile" | grep -F -e "${USER}" ; then
                echo "✓ $brewfile is valid"
              else
                echo "✗ $brewfile validation failed"
                exit 1
              fi
              set +xeuo pipefail
              echo "::endgroup::"
            done

      # --- Flatpaks ---
      - name: Set up Flathub
        if: ${{ !cancelled() && steps.filter.outputs.flatpaks == 'true' }}
        shell: bash
        run: |
          sudo apt-get install -y flatpak
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Validate Flatpaks
        id: flatpak-validate
        continue-on-error: true
        if: ${{ !cancelled() && steps.filter.outputs.flatpaks == 'true' }}
        shell: bash
        run: |
          echo "Validating flatpak files in custom/flatpak/ directory..."

          set -xeuo pipefail

          find "custom/flatpak" -iname '*\.list*' -print0 | \
            while IFS= read -r -d '' flatpaks_file ; do \
              echo "::group:: ===$(basename "$flatpaks_file")==="
              grep -v "#.*" "$flatpaks_file" | grep -v "^$" | \
                while read -r flatpak ; do \
                  flatpak remote-info --user flathub "${flatpak}"
                done
              echo "::endgroup::"
            done

      # --- Justfiles ---
      - name: Install just
        if: ${{ !cancelled() && steps.filter.outputs.justfiles == 'true' }}
        uses: extractions/setup-just@dd310ad5a97d8e7b41793f8ef055398d51ad4de6 # v2

      - name: Validate Justfiles
        id: just-validate
        continue-on-error: true
        if: ${{ !cancelled() && steps.filter.outputs.justfiles == 'true' }}
        shell: bash
        run: |
          echo "Validating justfiles in custom/ujust/ directory..."

          set -xeuo pipefail

          # Validate root Justfile
          echo "::group:: Validating Justfile"
          just --unstable --fmt --check -f Justfile
          echo "::endgroup::"

          # Validate custom ujust files
          find "custom/ujust" -iname '*.just' -print0 | \
            while IFS= read -r -d '' justfile ; do \
              echo "::group:: ===$(basename "$justfile")==="
              just --unstable --fmt --check -f "$justfile"
              echo "::endgroup::"
            done

          echo "All justfiles are valid"

      # --- Shell Scripts ---
      - name: Install ShellCheck
        if: ${{ !cancelled() && steps.filter.outputs.shell == 'true' }}
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Validate Shell Scripts
        id: shell-validate
        continue-on-error: true
        if: ${{ !cancelled() && steps.filter.outputs.shell == 'true' }}
        shell: bash
        run: |
          echo "Running shellcheck on build scripts..."

          set -xeuo pipefail

          find "build" -iname '*.sh' -print0 | \
            while IFS= read -r -d '' script ; do \
              echo "::group:: ===$(basename "$script")==="
              shellcheck -x "$script"
              echo "✓ $script passed shellcheck"
              echo "::endgroup::"
            done

          echo "All shell scripts passed validation"

      # --- Renovate ---
      - name: Setup Node.js
        if: ${{ !cancelled() && steps.filter.outputs.renovate == 'true' }}
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v6
        with:
          node-version: latest

      - name: Validate Renovate Config
        id: renovate-validate
        continue-on-error: true
        if: ${{ !cancelled() && steps.filter.outputs.renovate == 'true' }}
        shell: bash
        env:
          RENOVATE_VERSION: latest
        run: |
          npm install -g renovate@${RENOVATE_VERSION}
          renovate-config-validator --strict

      # --- Aggregate ---
      - name: Validation gate
        if: always()
        shell: bash
        run: |
          failed=()
          [[ "${{ steps.brew-validate.outcome }}"     == "failure" ]] && failed+=("Brewfiles")
          [[ "${{ steps.flatpak-validate.outcome }}"  == "failure" ]] && failed+=("Flatpaks")
          [[ "${{ steps.just-validate.outcome }}"     == "failure" ]] && failed+=("Justfiles")
          [[ "${{ steps.shell-validate.outcome }}"    == "failure" ]] && failed+=("Shell scripts")
          [[ "${{ steps.renovate-validate.outcome }}" == "failure" ]] && failed+=("Renovate config")
          if [[ ${#failed[@]} -gt 0 ]]; then
            echo "::error::Validations failed: ${failed[*]}"
            exit 1
          fi
          echo "All validations passed (or were skipped)."
