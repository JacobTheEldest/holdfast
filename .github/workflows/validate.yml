---
name: Validate

on:
  pull_request:
    branches:
      - master

# Each triggered validator runs even if previous steps fail.
# The final gate step fails the job if any validator failed.
# Validation logic is implemented in mise tasks for consistency with local dev.
# `mise run validate:<name>` tasks under .config/mise/tasks/
jobs:
  validate:
    name: Validation gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Detect changes
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: filter
        with:
          filters: |
            brew:
              - 'custom/brew/**'
              - '.config/mise/tasks/validate/brewfiles.sh'
            flatpaks:
              - 'custom/flatpak/**'
              - '.config/mise/tasks/validate/flatpaks.sh'
            justfiles:
              - 'custom/ujust/**'
              - 'Justfile'
              - '.config/mise/tasks/validate/justfiles.sh'
            shell:
              - 'build/**/*.sh'
              - '.config/mise/tasks/**/*.sh'
            renovate:
              - '.github/renovate.json5'
              - '.github/workflows/renovate.yml'
              - '.config/mise/tasks/validate/renovate.sh'

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up mise
        uses: jdx/mise-action@dba19683ed58901619b14f395a24841710cb4925 # v4.1.0
        with:
          install: true
          cache: true

      # --- Brewfiles ---
      - name: Set up Homebrew
        if: ${{ !cancelled() && steps.filter.outputs.brew == 'true' }}
        uses: Homebrew/actions/setup-homebrew@6eaeff80e7e5c43087c0e5eb5aa82120399e9c91 # master

      - name: Validate Brewfiles
        id: brew-validate
        continue-on-error: true
        if: ${{ !cancelled() && steps.filter.outputs.brew == 'true' }}
        shell: bash
        run: mise run validate:brewfiles

      # --- Flatpaks ---
      - name: Set up Flathub
        if: ${{ !cancelled() && steps.filter.outputs.flatpaks == 'true' }}
        shell: bash
        run: |
          sudo apt-get install -y flatpak
          flatpak remote-add --user --if-not-exists flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Validate Flatpaks
        id: flatpak-validate
        continue-on-error: true
        if: ${{ !cancelled() && steps.filter.outputs.flatpaks == 'true' }}
        shell: bash
        run: mise run validate:flatpaks

      # --- Justfiles ---
      - name: Validate Justfiles
        id: just-validate
        continue-on-error: true
        if: ${{ !cancelled() && steps.filter.outputs.justfiles == 'true' }}
        shell: bash
        run: mise run validate:justfiles

      # --- Shell Scripts ---
      - name: Validate Shell Scripts
        id: shell-validate
        continue-on-error: true
        if: ${{ !cancelled() && steps.filter.outputs.shell == 'true' }}
        shell: bash
        run: mise run validate:shell-scripts

      # --- Renovate ---
      - name: Validate Renovate Config
        id: renovate-validate
        continue-on-error: true
        if: ${{ !cancelled() && steps.filter.outputs.renovate == 'true' }}
        shell: bash
        env:
          RENOVATE_VERSION: latest
        run: mise run validate:renovate

      # --- Aggregate ---
      - name: Validation gate
        if: always()
        shell: bash
        run: |
          failed=()
          [[ "${{ steps.brew-validate.outcome }}"     == "failure" ]] && failed+=("Brewfiles")
          [[ "${{ steps.flatpak-validate.outcome }}"  == "failure" ]] && failed+=("Flatpaks")
          [[ "${{ steps.just-validate.outcome }}"     == "failure" ]] && failed+=("Justfiles")
          [[ "${{ steps.shell-validate.outcome }}"    == "failure" ]] && failed+=("Shell scripts")
          [[ "${{ steps.renovate-validate.outcome }}" == "failure" ]] && failed+=("Renovate config")
          if (( ${#failed[@]} > 0 )); then
            echo "::error::Validations failed: ${failed[*]}"
            exit 1
          fi
          echo "All validations passed (or were skipped)."
