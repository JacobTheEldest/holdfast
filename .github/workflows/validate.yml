---
name: Validate

on:
  pull_request:
    branches:
      - master

# Each triggered validator runs even if previous steps fail.
# The final gate step fails the job if any validator fails.
jobs:
  validate:
    name: Validation gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Detect changes
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: filter
        with:
          filters: |
            brew:
              - 'custom/brew/**'
            flatpaks:
              - 'custom/flatpak/**'
            justfiles:
              - 'custom/ujust/**'
              - 'Justfile'
            shell:
              - 'build/**/*.sh'
              - '.github/workflows/helpers/**/*.sh'
            renovate:
              - '.github/renovate.json5'
              - '.github/workflows/renovate.yml'

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # --- Brewfiles ---
      - name: Set up Homebrew
        if: ${{ !cancelled() && steps.filter.outputs.brew == 'true' }}
        uses: Homebrew/actions/setup-homebrew@6eaeff80e7e5c43087c0e5eb5aa82120399e9c91 # master

      - name: Validate Brewfiles
        id: brew-validate
        continue-on-error: true
        if: ${{ !cancelled() && steps.filter.outputs.brew == 'true' }}
        shell: bash
        run: .github/workflows/helpers/validate.sh brewfiles

      # --- Flatpaks ---
      - name: Set up Flathub
        if: ${{ !cancelled() && steps.filter.outputs.flatpaks == 'true' }}
        shell: bash
        run: .github/workflows/helpers/validate.sh setup-flathub

      - name: Validate Flatpaks
        id: flatpak-validate
        continue-on-error: true
        if: ${{ !cancelled() && steps.filter.outputs.flatpaks == 'true' }}
        shell: bash
        run: .github/workflows/helpers/validate.sh flatpaks

      # --- Justfiles ---
      - name: Install just
        if: ${{ !cancelled() && steps.filter.outputs.justfiles == 'true' }}
        uses: extractions/setup-just@dd310ad5a97d8e7b41793f8ef055398d51ad4de6 # v2

      - name: Validate Justfiles
        id: just-validate
        continue-on-error: true
        if: ${{ !cancelled() && steps.filter.outputs.justfiles == 'true' }}
        shell: bash
        run: .github/workflows/helpers/validate.sh justfiles

      # --- Shell Scripts ---
      - name: Install ShellCheck
        if: ${{ !cancelled() && steps.filter.outputs.shell == 'true' }}
        shell: bash
        run: .github/workflows/helpers/validate.sh setup-shellcheck

      - name: Validate Shell Scripts
        id: shell-validate
        continue-on-error: true
        if: ${{ !cancelled() && steps.filter.outputs.shell == 'true' }}
        shell: bash
        run: .github/workflows/helpers/validate.sh shell-scripts

      # --- Renovate ---
      - name: Setup Node.js
        if: ${{ !cancelled() && steps.filter.outputs.renovate == 'true' }}
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v6
        with:
          node-version: latest

      - name: Validate Renovate Config
        id: renovate-validate
        continue-on-error: true
        if: ${{ !cancelled() && steps.filter.outputs.renovate == 'true' }}
        shell: bash
        env:
          RENOVATE_VERSION: latest
        run: .github/workflows/helpers/validate.sh renovate

      # --- Aggregate ---
      - name: Validation gate
        if: always()
        shell: bash
        run: |
          failed=()
          [[ "${{ steps.brew-validate.outcome }}"     == "failure" ]] && failed+=("Brewfiles")
          [[ "${{ steps.flatpak-validate.outcome }}"  == "failure" ]] && failed+=("Flatpaks")
          [[ "${{ steps.just-validate.outcome }}"     == "failure" ]] && failed+=("Justfiles")
          [[ "${{ steps.shell-validate.outcome }}"    == "failure" ]] && failed+=("Shell scripts")
          [[ "${{ steps.renovate-validate.outcome }}" == "failure" ]] && failed+=("Renovate config")
          if (( ${#failed[@]} > 0 )); then
            echo "::error::Validations failed: ${failed[*]}"
            exit 1
          fi
          echo "All validations passed (or were skipped)."
