name: Clean up PR images
on:
  pull_request:
    types: [closed]
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}

jobs:
  delete-pr-images:
    name: Delete this PR's images
    # Fork PRs never push images (no packages:write), so there's nothing to delete.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      packages: write
    strategy:
      matrix:
        package: [holdfast, holdfast-nvidia-open]
    steps:
      - name: Delete pr-${{ github.event.pull_request.number }}.* tags
        uses: dataaxiom/ghcr-cleanup-action@cd0cdb900b5dbf3a6f2cc869f0dbb0b8211f50c4 # v1.0.16
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          packages: ${{ matrix.package }}
          delete-tags: pr-${{ github.event.pull_request.number }}.*
          delete-orphaned-images: true
