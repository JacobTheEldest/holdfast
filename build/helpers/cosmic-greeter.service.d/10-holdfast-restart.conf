[Unit]
# cosmic-comp 1.0.12+ has a known upstream bug where it SIGABRTs on
# exit due to a race between process::exit() and Mesa's atexit
# handler (libgallium util_queue_kill_threads). The crash is
# non-deterministic and timing-dependent — on a subsequent start it
# usually succeeds. The upstream unit's default rate limit
# (StartLimitBurst=5 over 30s) causes systemd to give up too soon
# and leave the user staring at a black screen. See:
#   https://github.com/pop-os/cosmic-comp/issues/2375
#   https://github.com/pop-os/cosmic-comp/pull/2382
#
# Widen the rate-limit window so the service is allowed many more
# restart attempts (paired with StartLimitBurst in [Service] below).
StartLimitIntervalSec=300s

[Service]
# Exponential backoff so we don't hammer the GPU when the race
# triggers repeatedly.
RestartSec=2s
RestartSteps=5
RestartMaxDelaySec=30s
StartLimitBurst=30

# Disable cosmic-comp direct scanout to work around an AMD Phoenix
# firmware bug that causes a black screen after login. The bug makes
# the amdgpu driver hit a REG_WAIT timeout in dcn31_program_compbuf_size,
# which leaves the DRM device paused and prevents rendering. Disabling
# direct scanout avoids the firmware code path triggering the bug.
# This must be set on the service (not /usr/lib/environment.d/) because
# greetd runs as a system service and does not inherit the user-level
# environment.d entries. The env var is inherited by the spawned
# cosmic-greeter-start process and the user session that follows.
# Confirmed working on Fedora COSMIC Atomic (Ryzen 7 7840U) and our
# AMD 780M. See:
#   https://www.reddit.com/r/Fedora/comments/1vhwa1h/
#   https://github.com/pop-os/cosmic-comp/issues/2375
Environment=COSMIC_DISABLE_DIRECT_SCANOUT=y
